<dialog #dialog class="new-case-dialog" (cancel)="cancel($event)">
  <div class="dialog-heading">
    <h2>Nova solicitação</h2>
    <button
      type="button"
      class="icon-button"
      aria-label="Fechar formulário"
      [disabled]="busy()"
      (click)="closed.emit()"
    >
      <cq-icon name="x" />
    </button>
  </div>
  <p>
    Descreva o atendimento. A solicitação entra na fila como Aberta e o evento
    de criação é publicado em segundo plano.
  </p>
  <form (submit)="submit($event)">
    <label>
      Título
      <input
        autofocus
        required
        maxlength="120"
        [value]="title()"
        (input)="title.set(text($event))"
        placeholder="Ex.: Erro ao gerar segunda via de boleto"
        [disabled]="busy()"
      />
    </label>
    <label>
      Descrição
      <textarea
        required
        maxlength="2000"
        rows="4"
        [value]="description()"
        (input)="description.set(text($event))"
        placeholder="Explique o que aconteceu, o que era esperado e o que já foi tentado."
        [disabled]="busy()"
      ></textarea>
    </label>
    <p class="form-hint">Não inclua dados pessoais ou sensíveis.</p>
    <cq-error-notice [error]="error()" />
    <div class="dialog-actions">
      <button
        type="button"
        class="secondary"
        [disabled]="busy()"
        (click)="fillExample()"
      >
        Preencher exemplo
      </button>
      <button
        class="primary"
        [disabled]="busy() || !title().trim() || !description().trim()"
      >
        {{ busy() ? "Salvando…" : "Criar solicitação" }}
      </button>
    </div>
  </form>
</dialog>
