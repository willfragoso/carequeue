server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Using a variable in proxy_pass makes Nginx resolve
  # "api" on each request (cached for `valid`) instead of once at startup, so
  # the frontend keeps working when the API container is recreated with a new IP.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
  }
  location /health/ {
    proxy_pass $api_upstream;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
