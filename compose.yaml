name: carequeue
x-app: &app
  build: { context: ., target: api }
  environment: &env
    DATABASE_URL: postgres://carequeue:local_demo_only@postgres:5432/carequeue
    RABBITMQ_URL: amqp://carequeue:local_demo_only@rabbitmq:5672
    MAX_RETRIES: 3
    RETRY_DELAY_MS: 2000
  restart: unless-stopped
  stop_grace_period: 20s
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: carequeue
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: carequeue
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carequeue -d carequeue"]
      interval: 3s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: carequeue
      RABBITMQ_DEFAULT_PASS: local_demo_only
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbit_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: { context: ., target: api }
    environment: *env
    command: ["node", "dist/src/entrypoints/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 10
  publisher:
    <<: *app
    command: ["node", "dist/src/entrypoints/publisher.js"]
  frontend:
    build: { context: ., target: frontend }
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
  worker:
    <<: *app
    command: ["node", "dist/src/entrypoints/worker.js"]
volumes:
  postgres_data:
  rabbit_data:
